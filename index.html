<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Horizon Launcher</title>
    <link rel="stylesheet" href="design/styles/electron/figma-theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="sidebar">
        <button class="nav-button active" title="Главная">🏠</button>
        <button class="nav-button" title="Магазин">🛍️</button>
        <button class="nav-button" title="Гардероб">👕</button>
        <button class="nav-button" title="Форум">💬</button>
        <button class="nav-button" title="Настройки">⚙️</button>

        <div id="login-form">
            <h3>Вход</h3>
            <input type="text" id="username" placeholder="Логин (Email/Ник)" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <button id="auth-button">Войти</button>
            <button id="tg-auth-button">Вход через Telegram</button>
        </div>

        <div id="play-button-container">
            <button id="play-button" disabled>Для игры войдите</button>
        </div>
    </div>

    <div class="content">
        <h1>📰 Добро пожаловать!</h1>
        <p>Здесь будут отображаться новости с вашего Discord-сервера.</p>
    </div>

    <script>
        const playButton = document.getElementById('play-button');
        const authButton = document.getElementById('auth-button');

        authButton.addEventListener('click', () => {
            console.log('Попытка входа...');
            // Временно: имитация успешного входа
            playButton.textContent = 'ИГРАТЬ';
            playButton.disabled = false;
        });

        playButton.addEventListener('click', () => {
            console.log('Запуск игры...');
            // Здесь будет код для запуска Minecraft (Этап 4)
        });
    </script>

</body>
</html>
